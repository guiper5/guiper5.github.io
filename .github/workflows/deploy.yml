name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissões necessárias pro Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node (troque por Bun se preferir)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        # "build": "vite build" + "postbuild": gera sitemap.xml, llms.txt e o
        # <head> estático de cada rota (scripts/build-seo.mts).

      # Inclui CNAME e .nojekyll no artefato (se existirem no root do repo)
      - name: Include CNAME and .nojekyll
        run: |
          if [ -f CNAME ]; then cp CNAME dist/; fi
          if [ -f .nojekyll ]; then cp .nojekyll dist/; fi

      # SPA fallback (React Router): 404.html -> index.html
      # IMPORTANTE: dist/index.html precisa continuar sendo o shell genérico.
      # build-seo.mts nunca reescreve a home justamente por causa desta cópia —
      # um 404.html com conteúdo de uma página específica serviria a meta errada
      # para toda URL desconhecida.
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
